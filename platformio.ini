[platformio]
default_envs = stackchan

[env:stackchan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
# BSP declares optional IR/NFC example libraries; Dash-Chan does not use them.
lib_ignore =
    IRremoteESP8266
    M5Unit-NFC
    SD
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    h2zero/NimBLE-Arduino@2.3.6
    mikalhart/TinyGPSPlus@1.1.0
extra_scripts = pre:tools/build_flags.py
